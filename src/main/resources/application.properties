spring.application.name=FlexClock

# The product is loopback only. The effective port is published in the instance descriptor,
# so the operating system may choose it (decision 0050; requirements RF-003, RF-135).
server.address=127.0.0.1
server.port=0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# SQLite single writer: write ahead logging, foreign keys on every connection, busy timeout and one
# pooled connection (decisions 0017, 0049; requirements RF-005, RNF-010, RNF-016).
spring.datasource.url=jdbc:sqlite:data/flexclock.db?journal_mode=WAL&foreign_keys=ON&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=flexclock-sqlite
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema and Hibernate only validates it (architecture contract, section 4.5).
spring.jpa.database-platform=br.com.flexclock.config.FlexClockSqliteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrates before the entity manager factory is built, so validation always sees the migrated
# schema. A fresh database applies V1. A database that already holds the Phase 0 tables but no history
# is baselined at version 1, which marks V1 as applied instead of replaying it against existing
# tables; forward migrations start at V2. Never clean, never repair, and abort on a checksum
# divergence (decisions 0017, 0049; requirements RF-157, RNF-012).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Phase 0 schema created by Hibernate
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# English canonical and ISO 8601 instants in UTC (architecture contract, section 9.4).
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true

# Product and contract defaults. The build filters the project version into this file.
flexclock.product.version=@project.version@
flexclock.schema.version=0
flexclock.locale.default=en
flexclock.region.clock-source=system
# Local OpenCode server. Loopback http target without user information, validated at startup, at the
# moment the setting is written and again on every use (decision 0043 and 0046; requirement RF-150).
# The retry follows decision 0046: three attempts with a backoff at one, two and four seconds.
# The effective endpoint comes from the settings table once the product is installed.
flexclock.opencode.base-url=http://127.0.0.1:4096
flexclock.opencode.connect-timeout=2s
flexclock.opencode.read-timeout=10s
flexclock.opencode.retry.max-attempts=3
flexclock.opencode.retry.initial-backoff=1s
flexclock.opencode.retry.multiplier=2
flexclock.instance.descriptor-path=data/flexclock.instance.json

# Anchor lifecycle. The window beats every 30 seconds and an anchor without a heartbeat for more than
# two minutes is an orphan and is deleted; the maintenance timer is local and never depends on the
# OpenCode server (decisions 0041 and 0046; requirements RF-016, RF-044, RN-008 and RN-009).
flexclock.anchor.stale-after=2m
flexclock.anchor.maintenance-interval-ms=30000
flexclock.anchor.maintenance-initial-delay-ms=30000

# Development tooling. The release profile disables both switches (requirement RF-156).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
