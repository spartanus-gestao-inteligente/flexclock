# Development profile. Activate it with --spring.profiles.active=dev.
# The SQLite configuration lives in application.properties because every profile needs it.

# Verbose application logging while developing.
logging.level.br.com.flexclock=DEBUG

# The OpenAPI document and the Swagger UI stay enabled in development only.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
