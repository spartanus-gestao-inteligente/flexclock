# Test profile. The persistence tests run against a real SQLite file, because write ahead logging,
# foreign keys and the dialect are part of what must be proven (requirements RNF-010, RNF-016).

# The test schema is created by the Flyway migrations, never by Hibernate, so every test runs against
# the same schema the release ships (architecture contract, section 4.5).
spring.datasource.url=jdbc:sqlite:target/flexclock-test/flexclock-test.db?journal_mode=WAL&foreign_keys=ON&busy_timeout=5000

# A fixed port for the mock web environment, so the Host allowlist has a known port to compare.
server.port=18080

flexclock.instance.descriptor-path=target/flexclock-test/flexclock.instance.json
flexclock.opencode.base-url=http://127.0.0.1:4096

# The anchor maintenance timer stays out of the tests: a test drives the maintenance service directly
# and asserts exact behaviour, instead of racing a background timer (requirement RNF-054).
flexclock.anchor.maintenance-interval-ms=3600000
flexclock.anchor.maintenance-initial-delay-ms=3600000

logging.level.br.com.flexclock=INFO
logging.level.org.hibernate.SQL=WARN
